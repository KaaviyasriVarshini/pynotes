<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greeting App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        form {
            margin-top: 30px;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 4px;
            width: 200px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        .greeting {
            margin-top: 30px;
            padding: 20px;
            background-color: #f0f8ff;
            border-radius: 8px;
            font-size: 24px;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <h1>Simple Greeting App</h1>
    
    <form method="POST" action="/">
        <label for="name">Enter your name:</label><br><br>
        <input type="text" id="name" name="name" placeholder="Your name" required>
        <button type="submit">Greet Me!</button>
    </form>

    {% if greeting %}
    <div class="greeting">
        {{ greeting }}
    </div>
    {% endif %}
</body>
</html>
